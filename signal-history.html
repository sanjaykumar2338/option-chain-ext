<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Option Signal History</title>
    <link rel="stylesheet" href="signal-history.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Signal history</h1>
          <p id="summary">Loading locally stored signals…</p>
        </div>
        <div class="actions">
          <button id="downloadJson" type="button">Download JSON</button>
          <button id="clearHistory" class="danger" type="button">Clear history</button>
        </div>
      </header>

      <div class="filters">
        <label>Instrument <input id="instrumentFilter" type="search" placeholder="NIFTY, BANKNIFTY…"></label>
        <label>Signal
          <select id="signalFilter">
            <option value="">All</option>
            <option value="call">BUY CALL</option>
            <option value="put">BUY PUT</option>
          </select>
        </label>
        <label>Dates per page
          <select id="pageSize"><option value="10" selected>10</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select>
        </label>
      </div>

      <div class="history-card">
        <div class="table-wrap">
          <table aria-label="Signal history by date">
            <thead><tr><th scope="col">Date ↓ (IST)</th><th scope="col">Signals</th><th scope="col">Buy call</th><th scope="col">Buy put</th><th scope="col">Instruments</th><th scope="col">Last signal (IST)</th><th scope="col">Action</th></tr></thead>
            <tbody id="dateRows"></tbody>
          </table>
        </div>
        <nav class="pagination" aria-label="History date pages">
          <span id="pageInfo" role="status" aria-live="polite"></span>
          <div class="page-buttons"><button id="previousPage" type="button">Previous</button><button id="nextPage" type="button">Next</button></div>
        </nav>
      </div>
      <p id="emptyState" class="empty" hidden>No stored signals match these filters.</p>
    </main>
    <script src="signal-history.js"></script>
  </body>
</html>
